services:
  db:
    image: postgres:15-alpine
    container_name: sneaker-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: sneaker_drop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sneaker_drop"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sneaker-network

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: sneaker-backend
    ports:
      - "5001:5000"
    volumes:
      - ./server:/app
      - /app/node_modules
    environment:
      PORT: 5000
      DATABASE_URL: postgres://postgres:postgres_password@db:5432/sneaker_drop
      JWT_SECRET: sneaker_drop_secret_key_12345
      NODE_ENV: development
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sneaker-network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: sneaker-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - sneaker-network

volumes:
  pgdata:
    driver: local

networks:
  sneaker-network:
    driver: bridge
